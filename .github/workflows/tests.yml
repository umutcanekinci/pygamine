name: tests

# Runs on GitHub's servers AFTER code arrives there:
#   * every push to any branch
#   * every pull request targeting main
on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately narrow (F + I002 -- see pyproject.toml's [tool.ruff.lint]
      # comment): real bugs, plus enforcing `from __future__ import
      # annotations` repo-wide, not a full style/formatting pass.
      - name: Lint (ruff)
        run: uv run --group dev ruff check .

  typecheck:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Deliberately permissive (see pyproject.toml's [tool.mypy] comment):
      # no --strict, untyped function bodies aren't checked yet. Catches
      # real type errors in already-annotated code, not a full-codebase
      # annotation mandate.
      - name: Type check (mypy)
        run: uv run --group dev mypy pygamine

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python allows >=3.12; classifiers claim 3.12/3.13/3.14 --
        # actually verify all three instead of only ever running the one
        # pinned for the (single-version) coverage job below.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Headless SDL so pygame.init() (via SpatialGrid's Rect construction)
      # works with no display.
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --group dev pytest -q

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job pushes the regenerated coverage badge
    env:
      # Pinned to one version -- coverage numbers/badge come from a single
      # canonical run, not the compatibility matrix above.
      UV_PYTHON: "3.12"
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests with coverage
        run: uv run --group dev pytest -q --cov=pygamine --cov-report=json --cov-report=term

      # Dogfoods this repo's own console script (see
      # pygamine/devtools/coverage_badge.py) -- the same one every host
      # project's CI now runs instead of keeping its own copy.
      # Only on a push to main -- PRs (esp. from forks) may lack push
      # access, and there's no reason to commit on every branch.
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: uv run pygamine-coverage-badge

      - name: Commit updated badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badge [skip ci]"
          file_pattern: .github/badges/coverage.json
