[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygamine"
version = "0.11.0"
description = "Shared pygame utilities for personal game projects"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Umutcan Ekinci", email = "umutcannekinci@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pyyaml",
    "pytmx",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.scripts]
# `uv run pygamine-coverage-badge` from a host project's repo root --
# replaces the byte-identical scripts/make_coverage_badge.py every host
# project used to carry a copy of.
pygamine-coverage-badge = "pygamine.devtools.coverage_badge:main"

[tool.setuptools.packages.find]
include = ["pygamine*"]

[tool.setuptools.package-data]
# PEP 561 marker -- lets type checkers (mypy/pyright) pick up this
# package's inline type hints when it's installed, not just when it's
# vendored on sys.path inside the same checkout being type-checked.
pygamine = ["py.typed"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real-socket loopback tests (slower)",
]

[tool.ruff.lint]
# Deliberately narrow: F (pyflakes -- real bugs like unused imports/vars)
# and I002 specifically (only the required-imports check below, not all of
# I -- I001 would additionally enforce import *sort order* repo-wide, a
# much bigger reformatting pass this isn't about). Not E/W (pycodestyle)
# either, which would flag ~200 long lines across tests/ that were a
# deliberate style choice, not an oversight.
select = ["F", "I002"]

[tool.mypy]
python_version = "3.12"
# Deliberately permissive, mirroring [tool.ruff.lint]'s "start narrow"
# approach: no --strict, untyped function bodies aren't checked yet. The
# goal right now is catching real type errors in already-annotated code
# (e.g. a `Surface | None` dereferenced without narrowing it first), not
# demanding a full annotation pass across the codebase in one go.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No published stubs (and no types-pytmx package) as of this writing.
module = ["pytmx.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
# Enforced repo-wide, not just where a type hint would otherwise need it
# (ruff's semantic FA rules find nothing on this project's Python 3.12+
# floor) -- consistency previously enforced this way, this document caught
# a real cross-project break once already (see CLAUDE.md's pygamine
# bump note): a Transform self-referencing type hint needed this import to
# evaluate lazily, and it only worked locally by accident because that one
# machine's Python defers annotation evaluation by default anyway.
required-imports = ["from __future__ import annotations"]
